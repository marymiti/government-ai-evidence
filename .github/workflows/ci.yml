
name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Download project code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated tests
        run: python -m pytest -v

  docker-build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Download project code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t government-ai-evidence:ci .

      - name: Test container health
        run: |
          docker run -d --name evidence-test -p 8080:8080 government-ai-evidence:ci
          for i in $(seq 1 20); do
            if curl --fail http://localhost:8080/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs evidence-test
          exit 1

  deploy:
    needs: [test, docker-build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: government-ai-evidence
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Authenticate Docker
        run: gcloud auth configure-docker europe-west2-docker.pkg.dev --quiet

      - name: Build and publish image
        run: |
          IMAGE="europe-west2-docker.pkg.dev/government-ai-evidence/evidence-images/evidence-api:${GITHUB_SHA}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: government-evidence-api
          region: europe-west2
          image: europe-west2-docker.pkg.dev/government-ai-evidence/evidence-images/evidence-api:${{ github.sha }}

      - name: Verify live application
        run: |
          curl --fail --retry 5 --retry-delay 3 \
            "${{ steps.deploy.outputs.url }}/health"
